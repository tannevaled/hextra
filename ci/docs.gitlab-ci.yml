# GitLab CI for a documentation site published one build per version.
#
# Include it from the documentation project, pinned to a commit of this theme:
#
#   include:
#     - remote: https://raw.githubusercontent.com/tannevaled/hextra/<commit>/ci/docs.gitlab-ci.yml
#   variables:
#     DOCS_URL: "https://example.org/docs"        # where the versions are served
#     DOCS_PACKAGE: "example-docs"                 # generic package of the builds
#     DOCS_SHOWCASE: "group/example.org"           # project whose Pages serve DOCS_URL
#     DOCS_TITLE: "Documentation Example"          # release name prefix
#
# Every version is a separate build under DOCS_URL/<version>/:
#   - a strict semantic-versioning tag vX.Y.Z → DOCS_URL/vX.Y.Z/  (a release)
#   - the default branch                     → DOCS_URL/development/
#
# ⛔ A version is its CONTENT; the LOOK is the default branch's, for every
# version. Each main or tag pipeline rebuilds ALL the versions with
# docsversions (github.com/go-fleettools/fleettools/cmd/docsversions): the
# default branch's tree -- theme submodule, hugo.yaml, layouts, assets, logos
# -- with each version's content/ swapped in. A change of look reaches every
# published version at the next pipeline; a release no longer freezes the
# interface it was tagged with. A merge request previews its own look on the
# development content (--skeleton HEAD).
#
# Each build is packaged into the generic package registry (version = tag or
# "development"), a GitLab release is created for tags, and the showcase
# pipeline is triggered: with ci/showcase-docs.gitlab-ci.yml it downloads every
# published version into public/docs/ and writes versions.json, which
# components/version-select.html reads.
#
# The theme is expected as the submodule themes/hextra; creation dates come
# from scripts/page-history.sh (params.page.history), hence the full history.

default:
  image: golang:1.27-bookworm

variables:
  HUGO_VERSION: "0.162.1"
  HUGO_ENV: production
  DOCSVERSIONS_VERSION: "v0.31.0"
  GIT_SUBMODULE_STRATEGY: recursive
  # The whole history: page dates come from git, and a shallow clone leaves
  # pages untouched by the last commits without one.
  GIT_DEPTH: "0"
  DOCS_ARCHIVE: "docs.tar.gz"
  # Set by the rules: a merge request previews its own look, development only.
  DOCS_BUILD_ARGS: ""

stages:
  - build
  - publish
  - deploy

# Only strict semantic-versioning tags (vMAJOR.MINOR.PATCH) are published.
.docs-release-tag: &docs-release-tag
  if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
.docs-main: &docs-main
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null

build:
  stage: build
  script:
    # The checkout and docsversions' worktree belong to another user than the
    # job's root: without this git refuses them ("dubious ownership") and Hugo
    # has no dates.
    - git config --global --add safe.directory '*'
    - wget -qO /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
    - tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
    - hugo version
    - mkdir -p bin
    - CGO_ENABLED=0 GOBIN="${CI_PROJECT_DIR}/bin" go install "github.com/go-fleettools/fleettools/cmd/docsversions@${DOCSVERSIONS_VERSION}"
    # A tag pipeline fetches only its tag: every version and the default
    # branch -- the look -- are fetched here.
    - git fetch --quiet origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}" "+refs/tags/*:refs/tags/*"
    # Every version (development and each vX.Y.Z) with the default branch's
    # look, into versions/<version>/; the version is the last segment of each
    # build's baseURL, where the version selector reads it.
    - bin/docsversions build --url "${DOCS_URL}" --branch "${CI_DEFAULT_BRANCH}" --out versions ${DOCS_BUILD_ARGS}
  artifacts:
    paths:
      - versions/
      - bin/docsversions
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        DOCS_BUILD_ARGS: "--skeleton HEAD --only development"
    - *docs-main
    - *docs-release-tag

# Package registry: version vX.Y.Z or "development", one file per version per
# pipeline; a download returns the most recent, so every version carries the
# current look once this job has run.
publish:
  stage: publish
  needs: [build]
  # The default image: it has the CA certificates the HTTPS upload needs
  # (debian:bookworm-slim does not).
  script:
    - bin/docsversions publish --dir versions --package "${DOCS_PACKAGE}" --archive "${DOCS_ARCHIVE}"
  rules:
    - *docs-main
    - *docs-release-tag

# A GitLab release for each tag, through the Releases API (no dependency on the
# release-cli or glab images).
release:
  stage: publish
  needs: [build, publish]
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
    - |
      cat > release.json <<EOF
      {
        "tag_name": "${CI_COMMIT_TAG}",
        "name": "${DOCS_TITLE} ${CI_COMMIT_TAG}",
        "description": "${DOCS_TITLE}, version ${CI_COMMIT_TAG} : ${DOCS_URL}/${CI_COMMIT_TAG}/",
        "assets": { "links": [
          { "name": "Documentation en ligne", "url": "${DOCS_URL}/${CI_COMMIT_TAG}/", "link_type": "other" },
          { "name": "${DOCS_ARCHIVE}", "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${DOCS_PACKAGE}/${CI_COMMIT_TAG}/${DOCS_ARCHIVE}", "link_type": "package" }
        ] }
      }
      EOF
    - >
      curl --fail-with-body --silent --show-error
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json"
      --data @release.json
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  rules:
    - *docs-release-tag

# Ask the showcase to redeploy: it publishes every version found in the registry.
deploy:
  stage: deploy
  needs: [publish]
  trigger:
    project: $DOCS_SHOWCASE
    branch: main
    strategy: depend
  rules:
    - *docs-main
    - *docs-release-tag
