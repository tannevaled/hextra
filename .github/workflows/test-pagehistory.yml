name: pagehistory

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/pagehistory/**"
      - "scripts/page-history.sh"
      - ".github/workflows/test-pagehistory.yml"

concurrency:
  group: pagehistory-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test (golden against the legacy script, race detector)
        working-directory: cmd/pagehistory
        run: go test -race -cover ./...
      - name: Fuzz (parsers of git output and paths)
        working-directory: cmd/pagehistory
        run: |
          go test -run xxx -fuzz FuzzParseLine -fuzztime 20s .
          go test -run xxx -fuzz FuzzEsc -fuzztime 20s .
          go test -run xxx -fuzz FuzzValidRelPath -fuzztime 20s .
      - name: Shim still prints the same JSON
        run: |
          sh scripts/page-history.sh > /tmp/shim.json
          test -s /tmp/shim.json
      - name: govulncheck
        working-directory: cmd/pagehistory
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
