name: publishversion

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/publishversion/**"
      - ".github/workflows/test-publishversion.yml"

concurrency:
  group: publishversion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test (race detector)
        working-directory: cmd/publishversion
        run: go test -race -cover ./...
      - name: Fuzz (the version argument)
        working-directory: cmd/publishversion
        run: go test -run xxx -fuzz FuzzVersionArgument -fuzztime 20s .
      - name: govulncheck
        working-directory: cmd/publishversion
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
